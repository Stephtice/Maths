<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organiser une collection de cubes</title>
<!-- v1.2 -->
<style>
  :root {
    --bg:#040814; --panel:#0a1228; --line:#1b2a4d;
    --neon:#3ef2ff; --violet:#9d5cff; --lime:#b8ff3e; --rouge:#ff3b3b;
    --text:#cfe4ff; --dim:#7f9cc7;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: "Segoe UI", system-ui, sans-serif; }
  #scene { position: absolute; inset: 0; display: block; }
  #btn-retour {
    position: fixed; top: 10px; right: 10px; z-index: 12;
    display: block; text-decoration: none; text-align: center;
    padding: 6px 12px; border: 1px solid #24386b; border-radius: 999px;
    background: rgba(13,26,54,.9); color: var(--dim); font-size: .85rem; font-weight: 700;
    cursor: pointer; box-shadow: 0 0 10px rgba(62,242,255,.1); backdrop-filter: blur(6px);
    transition: color .15s, border-color .15s, box-shadow .15s;
  }
  #btn-retour:hover { color: var(--neon); border-color: var(--neon); box-shadow: 0 0 14px rgba(62,242,255,.4); }
  .overlay {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(2, 5, 14, 0.7); z-index: 10;
  }
  .panel {
    background: linear-gradient(180deg, rgba(23,37,74,.95), rgba(10,18,40,.95)); border: 1px solid #24386b; border-radius: 14px; padding: 28px 34px; max-width: 480px;
    box-shadow: 0 0 44px rgba(62,242,255,.15), inset 0 0 40px rgba(10,20,50,.5); text-align: center;
  }
  .panel h2 { margin: 0 0 10px; color: var(--neon); font-size: 1.25rem; text-shadow: 0 0 12px rgba(62,242,255,.5); }
  .panel p { margin: 6px 0; color: var(--text); line-height: 1.45; }
  .panel button {
    margin-top: 14px; font-size: 1.05rem; padding: 10px 26px; border: none; border-radius: 9px;
    background: linear-gradient(135deg, var(--neon), var(--lime)); color: #04121f; cursor: pointer; font-weight: 600;
    box-shadow: 0 0 16px rgba(62,242,255,.45);
    transition: box-shadow .15s, transform .12s;
  }
  .panel button:hover { box-shadow: 0 0 24px rgba(62,242,255,.75); transform: translateY(-1px); }
  #askbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: rgba(8, 14, 32, 0.92); border-top: 1px solid #24386b;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.5);
    flex-wrap: wrap;
  }
  #askbar label { color: var(--text); font-weight: 600; font-size: 1.05rem; }
  #askbar input {
    font-size: 1.2rem; text-align: center; width: 140px; padding: 8px;
    border: 2px solid #24386b; border-radius: 8px; outline: none;
    background: var(--panel); color: var(--text);
  }
  #askbar input:focus { border-color: var(--neon); box-shadow: 0 0 12px rgba(62,242,255,.35); }
  #askbar button {
    font-size: 1.05rem; padding: 10px 22px; border: none; border-radius: 9px;
    background: linear-gradient(135deg, var(--neon), var(--lime)); color: #04121f; cursor: pointer; font-weight: 600;
    box-shadow: 0 0 12px rgba(62,242,255,.3);
  }
  #askbar button:hover { box-shadow: 0 0 20px rgba(62,242,255,.6); }
  #status {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(8, 14, 32, 0.92); border-radius: 10px; padding: 8px 18px;
    color: var(--text); font-size: 0.95rem; z-index: 5; max-width: 92%; text-align: center;
    border: 1px solid #24386b;
  }
  .big { font-size: 1.6rem; font-weight: 700; color: var(--neon); text-shadow: 0 0 10px rgba(62,242,255,.5); }
  .ok { color: var(--lime); font-weight: 700; }
  .ko { color: var(--rouge); font-weight: 700; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<a id="btn-retour" href="../" title="Retour aux applis">⌂ Accueil</a>
<div id="status" class="hidden"></div>
<div id="askbar" class="hidden">
  <label id="askLabel"></label>
  <input id="askInput" type="number" min="0" inputmode="numeric" value="">
  <button id="askGo">Valider</button>
  <button id="askSkip" style="background:transparent;color:#7f9cc7;box-shadow:none;">Passer</button>
</div>
<div id="modal" class="overlay hidden">
  <div class="panel" id="panelContent"></div>
</div>

<script>
"use strict";
window.addEventListener('error', function (e) {
  var s = document.getElementById("status");
  if (s) {
    s.classList.remove("hidden");
    s.textContent = "⚠️ Erreur : " + (e.message || "inconnue");
  }
});

const BG = "#040814";
const CUBE = "#3ef2ff";
const CUBE_DARK = "#1a8fb5";
const CUBE_LIGHT = "#9df6ff";
const STROKE = "rgba(62, 242, 255, 0.4)";

const canvas = document.getElementById("scene");
const ctx = canvas.getContext("2d");
let DPR = Math.min(window.devicePixelRatio || 1, 1.5);

let scatterCanvas, scatterCtx;
let settledCanvas, settledCtx;

let N = 0;
let scatterX, scatterY;     // positions dispersées (px)
let targetX, targetY;       // positions organisées (px)
let cubeGroup = null;       // index de groupe par cube (-1 = unité seule)
let cubeS = 4;               // taille courante d'un cube (px, phase organisée)
let scatterS = 4;            // taille des cubes à la dispersion (px, pour l'effacement)

let state = "idle";         // idle | scatter | organizing | done
let firstEstimate = null;
let rafId = null;
let anim = null;

const modal = document.getElementById("modal");
const panelContent = document.getElementById("panelContent");
const askbar = document.getElementById("askbar");
const askLabel = document.getElementById("askLabel");
const askInput = document.getElementById("askInput");
const askGo = document.getElementById("askGo");
const statusBox = document.getElementById("status");

let maxN = 100000; // nombre maximum choisi par l'utilisateur
let showLabels = true; // variante : afficher ou non la valeur des blocs
// Persistance du choix « afficher la valeur des blocs » entre les sessions
try {
  const saved = localStorage.getItem("cubes-showLabels");
  if (saved === "0") showLabels = false;
  if (saved === "1") showLabels = true;
} catch (e) { /* localStorage indisponible : valeur par défaut */ }

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = Math.floor(innerWidth * DPR);
  canvas.height = Math.floor(innerHeight * DPR);
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
}

function makeCanvas() {
  const c = document.createElement("canvas");
  c.width = canvas.width;
  c.height = canvas.height;
  return c;
}

function fmt(n) {
  return n.toLocaleString("fr-FR");
}

function drawCube(g, x, y, s, scale) {
  const k = scale || 1;
  const w = s * k;
  if (s >= 5 && k === 1) {
    g.fillStyle = CUBE;
    g.fillRect(x, y, w, w);
    g.fillStyle = CUBE_LIGHT;
    g.fillRect(x, y, w, Math.max(1, w * 0.22));
    g.fillStyle = CUBE_DARK;
    g.fillRect(x, y + w - Math.max(1, w * 0.18), w, Math.max(1, w * 0.18));
    if (s >= 8) {
      g.strokeStyle = STROKE;
      g.lineWidth = 1;
      g.strokeRect(x + 0.5, y + 0.5, w - 1, w - 1);
    }
  } else {
    g.fillStyle = CUBE;
    g.fillRect(x, y, w, w);
  }
}

// ---------- ÉTAPE 0 : choix du nombre maximum ----------
function askMax() {
  state = "idle";
  modal.classList.remove("hidden");
  askbar.classList.add("hidden");
  statusBox.classList.add("hidden");
  panelContent.innerHTML = `
    <h2>Organiser une collection de cubes</h2>
    <p>Jusqu'à combien de cubes veux-tu jouer&nbsp;?</p>
    <div id="maxChoices">
      <button class="maxBtn" data-max="10">jusqu'à 10</button>
      <button class="maxBtn" data-max="100">jusqu'à 100</button>
      <button class="maxBtn" data-max="1000">jusqu'à 1 000</button>
      <button class="maxBtn" data-max="10000">jusqu'à 10 000</button>
      <button class="maxBtn" data-max="100000">jusqu'à 100 000</button>
    </div>
    <p style="margin-top:14px;">… ou choisis un nombre maximum libre&nbsp;:</p>
    <input id="maxInput" type="number" min="1" max="100000" inputmode="numeric" placeholder="Ex. 250">
    <p class="err" id="maxErr"></p>
    <label style="display:flex; align-items:center; gap:8px; justify-content:center; margin:12px 0; color:#cfe4ff; cursor:pointer;">
      <input id="labelsChk" type="checkbox" style="width:18px; height:18px;">
      Afficher la valeur des blocs (1 000, 100, 10…)
    </label>
    <button id="maxGo">C'est parti&nbsp;!</button>
  `;
  const choices = document.getElementById("maxChoices");
  choices.style.display = "flex";
  choices.style.flexWrap = "wrap";
  choices.style.gap = "8px";
  choices.style.justifyContent = "center";
  choices.style.margin = "10px 0";
  const go = (v) => {
    if (!Number.isInteger(v) || v < 1 || v > 100000) {
      document.getElementById("maxErr").textContent =
        "Choisis un nombre entier entre 1 et 100 000.";
      return;
    }
    maxN = v;
    showLabels = document.getElementById("labelsChk").checked;
    try {
      localStorage.setItem("cubes-showLabels", showLabels ? "1" : "0");
    } catch (e) { /* stockage indisponible : choix non conservé */ }
    modal.classList.add("hidden");
    start();
  };
  for (const btn of choices.querySelectorAll(".maxBtn")) {
    btn.style.margin = "0";
    btn.style.fontSize = "0.95rem";
    btn.style.padding = "8px 14px";
    btn.style.background = "linear-gradient(135deg,#3ef2ff,#b8ff3e)"; btn.style.color = "#04121f";
    btn.onclick = () => go(parseInt(btn.dataset.max, 10));
  }
  // pré-coche la case selon le dernier choix sauvegardé
  document.getElementById("labelsChk").checked = showLabels;
  const input = document.getElementById("maxInput");
  input.style.fontSize = "1.1rem";
  input.style.textAlign = "center";
  input.style.width = "140px";
  input.style.padding = "8px";
  input.style.border = "2px solid #24386b"; input.style.background = "#0a1228"; input.style.color = "#cfe4ff";
  input.style.borderRadius = "8px";
  input.style.outline = "none";
  document.getElementById("maxGo").onclick = () => {
    const v = input.value === "" ? maxN : parseInt(input.value, 10);
    go(v);
  };
  input.focus();
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("maxGo").click();
  });
}

// ---------- ÉTAPE 1 : nombre aléatoire, affichage dispersé ----------
function start() {
  N = Math.floor(Math.random() * (maxN + 1)); // entre 0 et le maximum choisi
  state = "scatter";
  firstEstimate = null;
  buildScatter();
  statusBox.classList.remove("hidden");
  statusBox.innerHTML = N === 0
    ? "La collection est vide&nbsp;! Zéro cube…"
    : "Regarde cette collection de cubes. Sans les compter un par un, estime combien il y en a.";
  askEstimate(1);
}

function restart() {
  modal.classList.add("hidden");
  cancelAnimationFrame(rafId);
  rafId = null;
  // retour au choix du maximum
  askMax();
}

// Position dispersée : grille dense avec jitter, chaque cube au moins à moitié visible
function buildScatter() {
  resize();
  const W = canvas.width, H = canvas.height;

  const cellFactor = Math.min(4, Math.max(1, Math.sqrt(3000 / Math.max(N, 1))));
  let s = Math.sqrt((W * H * 0.72) / (Math.max(N, 1) * cellFactor * cellFactor));
  s = Math.max(1.5, Math.min(22, s));
  cubeS = s;
  scatterS = s;

  const cell = s * cellFactor;
  // Lignes de 10 cubes (facilite le comptage par dizaines),
  // avec un décalage aléatoire pour garder l'aspect « en vrac »
  const perLine = 10;
  const maxCols = Math.max(1, Math.floor((W * 0.94) / cell));
  const lineBlocks = Math.max(1, Math.floor(maxCols / perLine));
  // plusieurs blocs de 10 côte à côte par ligne physique
  const cols = Math.min(maxCols, lineBlocks * perLine);
  const rows = Math.max(1, Math.ceil(N / cols));
  const offX = (W - Math.min(cols * cell, W)) / 2;
  const offY = (H - Math.min(rows * cell, H)) / 2;

  scatterX = new Float32Array(N);
  scatterY = new Float32Array(N);

  const jit = Math.max(0, (cell - s) * 0.5);
  for (let i = 0; i < N; i++) {
    // position dans la ligne : 0..9 puis nouvelle ligne de 10
    const c = i % cols;
    const r = Math.floor(i / cols);
    scatterX[i] = offX + c * cell + jit * (Math.random() * 2 - 1);
    scatterY[i] = offY + r * cell + jit * (Math.random() * 2 - 1);
  }

  scatterCanvas = makeCanvas();
  scatterCtx = scatterCanvas.getContext("2d");
  scatterCtx.fillStyle = BG;
  scatterCtx.fillRect(0, 0, W, H);
  for (let i = 0; i < N; i++) {
    drawCube(scatterCtx, scatterX[i], scatterY[i], s, 1);
  }

  settledCanvas = makeCanvas();
  settledCtx = settledCanvas.getContext("2d");
  renderStill();
}

// ---------- Barre d'estimation (ne masque pas les cubes) ----------
function askEstimate(step) {
  state = step === 1 ? "scatter" : "done";
  askLabel.innerHTML = step === 1
    ? "Combien de cubes vois-tu&nbsp;?"
    : "Les cubes sont rangés. Combien y a-t-il de cubes maintenant&nbsp;?";
  askInput.value = "";
  askbar.classList.remove("hidden");
  askInput.focus();
  askGo.onclick = () => {
    const v = parseInt(askInput.value, 10);
    if (!Number.isInteger(v) || v < 0) {
      askInput.style.borderColor = "#ff3b3b";
      askInput.placeholder = "Nombre entier";
      return;
    }
    askInput.style.borderColor = "#24386b";
    if (step === 1) {
      firstEstimate = v;
      askbar.classList.add("hidden");
      statusBox.innerHTML = "Estimation notée&nbsp;! Les cubes se rangent par dizaines, centaines puis milliers…";
      startOrganise();
    } else {
      askbar.classList.add("hidden");
      showFinalFeedback(v);
    }
  };
  // bouton « Passer » : continue sans réponse
  askSkip.onclick = () => {
    askbar.classList.add("hidden");
    if (step === 1) {
      firstEstimate = null;
      statusBox.innerHTML = "Estimation passée. Les cubes se rangent par dizaines, centaines puis milliers…";
      startOrganise();
    } else {
      showFinalFeedback(null);
    }
  };
}

// ---------- Organisation : calcul des positions et groupes ----------
function computeOrganisedLayout() {
  const W = canvas.width, H = canvas.height;
  const pad = 70 * DPR;
  const availW = W - pad * 2;
  const availH = H - pad * 2 - 60 * DPR;

  const th = Math.floor(N / 1000);
  const h = Math.floor((N % 1000) / 100);
  const t = Math.floor((N % 100) / 10);
  const u = N % 10;

  const gap = 3;
  // Matériel base 10 : unité 1×1 ; dizaine 10×1 ; centaine 10×10 ;
  // millier = grand cube 10×10×10 vu en 3D (décalage de profondeur en unités)
  const d3 = 2.6;

  // Rangées de 10 blocs de milliers (10 × 1 000 = 10 000 par rangée)
  // pour faciliter le comptage ; 5 par rangée si l'écran est étroit.
  // La dernière rangée peut être incomplète.
  let best = null;
  const candidates = th <= 10 ? [Math.max(1, th)] : [10, 5];
  for (const bpr of candidates) {
    const rows = Math.ceil(th / bpr) || 1;
    const blocksW = th ? bpr * (10 + d3) + (bpr - 1) * gap : 0;
    let remW = 0;
    if (h) remW += h * 10 + (h - 1) * gap;
    if (t) {
      // dizaines empilées par colonnes de 5 : largeur = nombre de colonnes
      const tenCols = Math.ceil(t / 5);
      remW += (h ? gap : 0) + tenCols * 10 + (tenCols - 1) * gap;
    }
    if (u) {
      // largeur des constellations de dés (grille 3×3 par tranche de 5)
      const nbDice = Math.ceil(u / 5);
      // toutes les constellations ont la taille du 5 (≈ 5,05 cubes) + écart
      const diceWMax = 5.05 + gap;
      remW += (h || t ? gap : 0) + nbDice * diceWMax + (nbDice - 1) * gap;
    }
    const widthUnits = Math.max(blocksW, remW);
    // hauteur du reste : centaines/dizaines posent 10 de haut ;
    // constellations de dés posent aussi 5 de haut (grille 3×3 en cases ×2)
    const remH = (h || t || u) ? 10 : 1;
    const heightUnits = rows * (10 + d3 + gap) + remH + (th ? gap : 0);
    const scale = Math.min(availW / Math.max(widthUnits, 1), availH / Math.max(heightUnits, 1), 22 * DPR);
    if (!best || scale > best.scale) best = { bpr, scale, widthUnits, heightUnits };
  }

  const scale = Math.max(1, best.scale);
  cubeS = scale;
  const s = scale;
  const g = gap * s;
  const positions = { x: new Float32Array(N), y: new Float32Array(N) };
  cubeGroup = new Int32Array(N).fill(-1);
  const groups = [];

  const totalW = best.widthUnits * s;
  const totalH = best.heightUnits * s;
  const originX = (W - totalW) / 2;
  const originY = (H - totalH) / 2 + 10 * DPR;

  const bpr = best.bpr;
  const rows = Math.ceil(th / bpr) || 1;

  const d3s = d3 * s; // décalage 3D en px

  let idx = 0;
  for (let b = 0; b < th; b++) {
    const row = Math.floor(b / bpr);
    const col = b % bpr;
    const bx = originX + col * ((10 + d3) * s + g);
    const by = originY + row * ((10 + d3) * s + g);
    const gIdx = groups.length;
    // Les 1 000 cubes volent vers la face avant du grand cube
    // (10 couches de 100 superposées : ils disparaissent une fois rangés)
    for (let layer = 0; layer < 10; layer++) {
      for (let yy = 0; yy < 10; yy++) {
        for (let xx = 0; xx < 10; xx++) {
          positions.x[idx] = bx + xx * s;
          positions.y[idx] = by + yy * s;
          cubeGroup[idx] = gIdx;
          idx++;
        }
      }
    }
    groups.push({
      kind: "thousand",
      x: bx, y: by, w: 10 * s, h: 10 * s, d3: d3s,
      label: "1 000", strong: true, lastIdx: idx - 1, drawn: false,
    });
  }

  const restY = originY + (th ? rows * ((10 + d3) * s + g) : 0);
  let rx = originX;
  const baseY = restY + 10 * s;

  for (let c = 0; c < h; c++) {
    const gIdx = groups.length;
    for (let yy = 0; yy < 10; yy++) {
      for (let xx = 0; xx < 10; xx++) {
        positions.x[idx] = rx + xx * s;
        positions.y[idx] = baseY - (yy + 1) * s;
        cubeGroup[idx] = gIdx;
        idx++;
      }
    }
    groups.push({
      kind: "hundred",
      x: rx, y: baseY - 10 * s, w: 10 * s, h: 10 * s,
      label: "100", strong: false, lastIdx: idx - 1, drawn: false,
    });
    rx += 10 * s + g;
  }
  // Dizaines : réglettes empilées par colonnes de 5 maximum.
  // Après 5 réglettes superposées, une nouvelle colonne démarre à droite.
  for (let b = 0; b < t; b++) {
    const gIdx = groups.length;
    const col = Math.floor(b / 5);      // colonne courante
    const row = b % 5;                  // rangée dans la colonne (0 = en haut... on empile vers le haut)
    const bx = rx + col * (10 * s + g);
    // espace vertical réduit entre réglettes empilées : 1 cube
    const vGap = s;
    const by = baseY - (row + 1) * s - row * vGap;
    for (let xx = 0; xx < 10; xx++) {
      positions.x[idx] = bx + xx * s;
      positions.y[idx] = by;
      cubeGroup[idx] = gIdx;
      idx++;
    }
    groups.push({
      kind: "ten",
      x: bx, y: by, w: 10 * s, h: s,
      label: "10", strong: false, lastIdx: idx - 1, drawn: false,
    });
  }
  // avance rx après la dernière colonne de dizaines
  const tenCols = Math.ceil(t / 5);
  if (t) rx += tenCols * 10 * s + (tenCols - 1) * g + g;
  // Unités : disposition en « constellation de dés » jusqu'à 5, puis en
  // constellations côte à côte au-delà (6 = 5+1, 7 = 5+2, 8 = 5+3, 9 = 5+4)
  if (u) {
    const dice = {
      1: [[1, 1]],
      2: [[0, 0], [2, 2]],
      3: [[0, 0], [1, 1], [2, 2]],
      4: [[0, 0], [0, 2], [2, 0], [2, 2]],
      5: [[0, 0], [0, 2], [1, 1], [2, 0], [2, 2]],
    };
    // grille 3×3 d'un dé, même cellule aérée pour toutes les constellations :
    // le 5 (quincunx) impose une cellule ×1,35 pour dégager le point central
    // des coins en diagonale ; toutes les figures partagent cette taille.
    const cell = s * 1.5 * 1.35;  // cellule unique, aérée comme le 5
    const diceW = cell * 2 + s;   // largeur d'une constellation ≈ 5,05 cubes
    const diceH = cell * 2 + s;   // hauteur d'une constellation ≈ 5,05 cubes
    const unitsStartX = rx;       // début réel de la zone des unités
    let maxDiceH = diceH;         // hauteur de la plus grande constellation posée
    let remaining = u;
    while (remaining > 0) {
      const n = Math.min(remaining, 5);
      remaining -= n;
      const pts = dice[n];
      for (const [cx, cy] of pts) {
        positions.x[idx] = rx + cx * cell;
        positions.y[idx] = baseY - s - cy * cell;
        cubeGroup[idx] = -1;
        idx++;
      }
      rx += diceW + g * 2;
    }
    // largeur réellement occupée : dernière position + un cube, moins l'écart final
    const totalUnitsW = (rx - g * 2) - unitsStartX;
    // micro-marge (0,5 px) pour absorber les arrondis flottants
    const m5 = 0.5;
    groups.push({
      kind: "units",
      x: unitsStartX - m5, y: baseY - maxDiceH - m5, w: totalUnitsW + m5 * 2, h: maxDiceH + m5 * 2,
      label: String(u), strong: false, lastIdx: idx - 1, drawn: false,
      unitsOnly: true,
      // les cubes unités restent dessinés : pas d'effacement ni de fondu
      noErase: true,
    });
  }

  return { positions, groups };
}

function breakdownText() {
  const th = Math.floor(N / 1000);
  const h = Math.floor((N % 1000) / 100);
  const t = Math.floor((N % 100) / 10);
  const u = N % 10;
  const parts = [];
  if (th) parts.push(`${fmt(th)} millier${th > 1 ? "s" : ""}`);
  if (h) parts.push(`${h} centaine${h > 1 ? "s" : ""}`);
  if (t) parts.push(`${t} dizaine${t > 1 ? "s" : ""}`);
  if (u) parts.push(`${u} unité${u > 1 ? "s" : ""}`);
  return parts.length ? parts.join(", ") : "aucun cube";
}

// ---------- Animation de rangement ----------
function startOrganise() {
  if (state === "organizing") return;
  state = "organizing";
  askbar.classList.add("hidden");

  const L = computeOrganisedLayout();
  targetX = L.positions.x;
  targetY = L.positions.y;

  const waveCount = 50;
  const waveSize = Math.max(1, Math.ceil(N / waveCount));
  const gapMs = Math.max(25, Math.min(130, 3500 / waveCount));
  const durMs = 320;
  anim = {
    start: performance.now(),
    waveSize, gapMs, durMs,
    launchedUpTo: 0,
    settledUpTo: 0,
    groups: L.groups,
    finalizedUpTo: 0,
  };
  startLoop();
}

function easeInOut(p) {
  return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
}

// ---------- Rendu du matériel base 10 ----------
function drawBase10(grp, s) {
  drawBase10On(settledCtx, grp, s);
}

function drawBase10On(g2, grp, s) {
  const lw = Math.max(1.5, s * 0.22);
  g2.lineJoin = "round";

  if (grp.unitsOnly) return; // les cubes unités restent dessinés, pas de bloc

  if (grp.kind === "thousand") {
    // Grand cube 10×10×10 vu en 3D : face avant + faces supérieure et droite
    const x = grp.x, y = grp.y, w = grp.w, d = grp.d3;
    // face supérieure (parallélogramme)
    g2.beginPath();
    g2.moveTo(x, y); g2.lineTo(x + d, y - d);
    g2.lineTo(x + w + d, y - d); g2.lineTo(x + w, y);
    g2.closePath();
    g2.fillStyle = CUBE_LIGHT; g2.fill();
    // face droite (parallélogramme)
    g2.beginPath();
    g2.moveTo(x + w, y); g2.lineTo(x + w + d, y - d);
    g2.lineTo(x + w + d, y - d + w); g2.lineTo(x + w, y + w);
    g2.closePath();
    g2.fillStyle = CUBE_DARK; g2.fill();
    // face avant (carré 10×10)
    g2.fillStyle = CUBE; g2.fillRect(x, y, w, w);
    // grille 10×10 sur la face avant
    g2.strokeStyle = STROKE; g2.lineWidth = 1;
    for (let i = 1; i < 10; i++) {
      const p = i * s;
      g2.beginPath(); g2.moveTo(x + p, y); g2.lineTo(x + p, y + w); g2.stroke();
      g2.beginPath(); g2.moveTo(x, y + p); g2.lineTo(x + w, y + p); g2.stroke();
    }
    g2.strokeStyle = "rgba(4, 8, 20, 0.9)";
    g2.lineWidth = lw;
    g2.strokeRect(x, y, w, w);
  } else {
    // Centaine : plaque 10×10 ; dizaine : réglette 10×1
    g2.fillStyle = CUBE;
    g2.fillRect(grp.x, grp.y, grp.w, grp.h);
    g2.fillStyle = CUBE_LIGHT;
    g2.fillRect(grp.x, grp.y, grp.w, Math.max(1, grp.h * 0.2));
    g2.fillStyle = CUBE_DARK;
    g2.fillRect(grp.x, grp.y + grp.h - Math.max(1, grp.h * 0.15), grp.w, Math.max(1, grp.h * 0.15));
    g2.strokeStyle = STROKE; g2.lineWidth = 1;
    if (grp.kind === "hundred") {
      for (let i = 1; i < 10; i++) {
        const p = i * s;
        g2.beginPath(); g2.moveTo(grp.x + p, grp.y); g2.lineTo(grp.x + p, grp.y + grp.h); g2.stroke();
        g2.beginPath(); g2.moveTo(grp.x, grp.y + p); g2.lineTo(grp.x + grp.w, grp.y + p); g2.stroke();
      }
    } else {
      for (let i = 1; i < 10; i++) {
        const p = i * s;
        g2.beginPath(); g2.moveTo(grp.x + p, grp.y); g2.lineTo(grp.x + p, grp.y + grp.h); g2.stroke();
      }
    }
    g2.strokeStyle = "rgba(4, 8, 20, 0.9)";
    g2.lineWidth = lw;
    g2.strokeRect(grp.x, grp.y, grp.w, grp.h);
  }

  // étiquette (masquée dans la variante « sans valeurs »)
  if (showLabels) {
    const fs = Math.max(11 * DPR, Math.min(s * 3, 24 * DPR));
    g2.fillStyle = grp.strong ? "#3ef2ff" : "#9d5cff";
    g2.textAlign = "center";
    g2.font = `${grp.strong ? "bold " : ""}${fs}px sans-serif`;
    const labelY = grp.kind === "thousand" ? grp.y + grp.h + Math.max(10, s) : grp.y + grp.h + Math.max(10, s * 1.4);
    g2.fillText(grp.label, grp.x + grp.w / 2, labelY);
  }
}

function drawOrganizing(now) {
  const a = anim;
  const t = now - a.start;
  const waveIdx = Math.floor(t / a.gapMs);
  const launchTarget = Math.min(N, (waveIdx + 1) * a.waveSize);

  if (launchTarget > a.launchedUpTo) {
    // efface avec la plus GRANDE des deux tailles (dispersée vs organisée)
    // + une marge : le cube dessiné en vol peut être agrandi (×1,35) et
    // son relief/stroke déborde du carré de base
    const s = Math.max(scatterS, cubeS);
    const m = Math.ceil(s * 0.35) + 2;
    scatterCtx.fillStyle = BG;
    for (let i = a.launchedUpTo; i < launchTarget; i++) {
      scatterCtx.fillRect(scatterX[i] - m, scatterY[i] - m, s + m * 2, s + m * 2);
    }
    a.launchedUpTo = launchTarget;
  }

  const doneWave = Math.floor((t - a.durMs) / a.gapMs);
  const settleTarget = Math.min(a.launchedUpTo, Math.max(0, doneWave * a.waveSize));
  if (settleTarget > a.settledUpTo) {
    for (let i = a.settledUpTo; i < settleTarget; i++) {
      // Construction visible : chaque cube posé reste dessiné à sa place,
      // on voit la réglette / plaque / face du grand cube se construire.
      drawCube(settledCtx, targetX[i], targetY[i], cubeS, 1);
    }
    a.settledUpTo = settleTarget;
  }

  // Finalisation en fondu : quand un groupe est complet, le bloc final
  // recouvre progressivement la construction (fondu ~400 ms).
  // Les groupes « unitsOnly » (cubes unités) ne passent pas par le fondu :
  // leurs cubes restent dessinés, aucun effacement ni remplacement.
  const FADE_MS = 400;
  for (let gi = 0; gi < a.groups.length; gi++) {
    const grp = a.groups[gi];
    if (grp.drawn) continue;
    if (grp.noErase) {
      // cadre des unités : tracé directement, cubes conservés
      settledCtx.strokeStyle = "rgba(4, 8, 20, 0.9)";
      settledCtx.lineWidth = Math.max(1.5, cubeS * 0.18);
      settledCtx.strokeRect(grp.x, grp.y, grp.w, grp.h);
      grp.drawn = true;
      a.finalizedUpTo = Math.max(a.finalizedUpTo, gi + 1);
      continue;
    }
    if (grp.lastIdx < a.settledUpTo) {
      if (grp.fadeStart === undefined) grp.fadeStart = t;
      const alpha = Math.min(1, (t - grp.fadeStart) / FADE_MS);
      grp.fadeAlpha = alpha;
      if (alpha >= 1) {
        // efface la construction (cubes individuels) puis grave le bloc final
        // (marge élargie pour le millier : sa face 3D déborde de grp.d3)
        const m = 4;
        const d = grp.d3 || 0;
        settledCtx.fillStyle = BG;
        settledCtx.fillRect(grp.x - m, grp.y - m - d, grp.w + m * 2 + d, grp.h + m * 2 + d);
        drawBase10(grp, cubeS);
        grp.drawn = true;
        a.finalizedUpTo = Math.max(a.finalizedUpTo, gi + 1);
      }
    }
  }

  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(scatterCanvas, 0, 0);
  ctx.drawImage(settledCanvas, 0, 0);

  // blocs en cours de fondu (dessinés sur le canvas principal avec alpha)
  for (const grp of a.groups) {
    if (!grp.drawn && grp.fadeAlpha !== undefined && grp.fadeAlpha < 1) {
      ctx.save();
      ctx.globalAlpha = grp.fadeAlpha;
      drawBase10On(ctx, grp, cubeS);
      ctx.restore();
    }
  }

  const firstFlight = Math.max(0, (doneWave + 1)) * a.waveSize;
  for (let i = firstFlight; i < a.launchedUpTo; i++) {
    const p = (t - Math.floor(i / a.waveSize) * a.gapMs) / a.durMs;
    if (p <= 0 || p >= 1) continue;
    const e = easeInOut(p);
    const x = scatterX[i] + (targetX[i] - scatterX[i]) * e;
    const lift = Math.sin(p * Math.PI) * 26 * DPR;
    const y = scatterY[i] + (targetY[i] - scatterY[i]) * e - lift;
    const k = 1 + 0.35 * Math.sin(p * Math.PI);
    drawCube(ctx, x - cubeS * (k - 1) / 2, y - cubeS * (k - 1) / 2, cubeS, k);
  }

  // fin seulement quand tous les cubes sont posés ET tous les blocs
  // gravés (fondus terminés)
  const allDrawn = a.groups.every((g) => g.drawn || g.unitsOnly);
  if (a.settledUpTo >= N && a.launchedUpTo >= N && allDrawn) {
    finishOrganise();
  }
}

function finishOrganise() {
  state = "done";
  statusBox.innerHTML = `Collection organisée&nbsp;! Lis les groupes&nbsp;: ${breakdownText()}.`;
  cancelAnimationFrame(rafId);
  rafId = null;
  renderStill();
  setTimeout(() => askEstimate(2), 600);
}

// ---------- Résultat ----------
function showFinalFeedback(v) {
  const passed = v === null || v === undefined;
  const good = !passed && v === N;
  const diff = passed ? 0 : v - N;
  const reponseHTML = passed
    ? `<p>Réponse passée.</p>`
    : `<p>Ta réponse après organisation&nbsp;: <span class="big">${fmt(v)}</span></p>
       <p>${good
         ? `C'est exactement le bon nombre&nbsp;! Il y a bien <b>${fmt(N)}</b> cubes.`
         : `Il y a en réalité <b>${fmt(N)}</b> cubes, soit ${diff > 0 ? `${fmt(diff)} de moins que ta réponse` : `${fmt(-diff)} de plus que ta réponse`}.`}</p>`;
  const estimHTML = firstEstimate === null
    ? `<p style="border-top:1px solid #24386b; padding-top:10px; margin-top:12px;">
         Pas d'estimation notée avant l'organisation.
       </p>`
    : `<p style="border-top:1px solid #24386b; padding-top:10px; margin-top:12px;">
         Ton estimation <b>avant</b> l'organisation était&nbsp;: <b>${fmt(firstEstimate)}</b>
         (${firstEstimate === N ? "déjà exacte" : "à " + fmt(Math.abs(firstEstimate - N)) + " cubes près"}).
       </p>`;
  panelContent.innerHTML = `
    <h2>${passed ? "Réponse passée" : good ? "🎉 Bonne réponse&nbsp;!" : "Pas tout à fait…"}</h2>
    ${reponseHTML}
    ${estimHTML}
    <p>${breakdownText()} — on lit la quantité dans les groupes, sans compter les cubes un par un.</p>
    <button id="restartBtn">Recommencer</button>
  `;
  modal.classList.remove("hidden");
  document.getElementById("restartBtn").onclick = () => {
    restart();
  };
}

function renderStill() {
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (scatterCanvas) ctx.drawImage(scatterCanvas, 0, 0);
  if (settledCanvas && (state === "done" || state === "organizing")) {
    ctx.drawImage(settledCanvas, 0, 0);
  }
}

function startLoop() {
  cancelAnimationFrame(rafId);
  const loop = (now) => {
    if (state === "organizing") {
      drawOrganizing(now);
      rafId = requestAnimationFrame(loop);
    } else {
      renderStill();
      rafId = null;
    }
  };
  rafId = requestAnimationFrame(loop);
}

window.addEventListener("resize", () => {
  if (N > 0 && state === "scatter") {
    buildScatter();
  }
});

askMax();
</script>
</body>
